# GoaCore — installation clé en main (image pré-construite, sans compilation).
#
# Démarrage :
#   1. Récupérer ce fichier et le .env.example voisin :
#        curl -O https://raw.githubusercontent.com/GoaCloud/GoaCore/main/install/docker-compose.yml
#        curl -o .env https://raw.githubusercontent.com/GoaCloud/GoaCore/main/install/.env.example
#   2. Éditer .env : générer SESSION_SECRET (openssl rand -hex 32) et définir des mots
#      de passe MySQL forts. Le reste (Proxmox, Wazuh, Discord, IA) est OPTIONNEL et se
#      configure ensuite depuis l'interface web.
#   3. docker compose up -d
#   4. Ouvrir https://<hôte>:8443/setup pour créer le compte administrateur.
#
# L'app crée tout son schéma de base au premier démarrage (aucun script SQL requis).
# Elle est servie en HTTPS. Le certificat auto-signé est PERSISTÉ dans le volume
# goacore_tls et n'est régénéré que s'il est absent, expiré ou s'il ne couvre plus
# TLS_HOSTS : renseignez-y le nom/IP par lequel vous accédez à GoaCore pour que
# l'avertissement du navigateur ne réapparaisse pas à chaque mise à jour. Vous
# pouvez aussi fournir votre propre certificat (TLS_CERT_FILE / TLS_KEY_FILE).
#
# ─── SAUVEGARDE (à mettre en place le jour de l'installation) ────────────────────
# Le volume mysql_data contient TOUT l'état de GoaCore et ses secrets chiffrés
# (token Proxmox, clés SSH). La clé de déchiffrement est dérivée de SESSION_SECRET,
# qui n'est PAS dans la base : un dump sans SESSION_SECRET est irrécupérable.
# Sauvegardez les deux, et testez la restauration.
#
#   ./backup.sh dump                # dump horodaté, gzip, dans ./backups
#   ./backup.sh restore <fichier>   # restauration dans la base en place
#   ./backup.sh prune               # applique la rétention
#   0 3 * * *  cd /opt/goacore && ./backup.sh dump && ./backup.sh prune
#
# backup.sh est fourni à côté de ce fichier :
#   curl -O https://raw.githubusercontent.com/GoaCloud/GoaCore/main/install/backup.sh && chmod +x backup.sh
# ────────────────────────────────────────────────────────────────────────────────
services:
  app:
    # Pour un parc en production, épinglez une version (GOACORE_TAG=v1.4.0) plutôt
    # que « latest » : une mise à jour doit être une décision, pas un effet de bord
    # du prochain `compose pull`.
    image: ghcr.io/goacloud/goacore:${GOACORE_TAG:-latest}
    container_name: goacore_app
    ports:
      - "8443:8443"
    environment:
      # --- Base de données (réseau interne compose : l'hôte "db" est résolu) ---
      - DB_HOST=db:3306
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASSWORD}
      - DB_PASS_FILE=${DB_PASSWORD_FILE:-}
      - DB_NAME=${DB_NAME}
      - PORT=8080
      - HTTPS_PORT=8443
      # --- Sécurité (REQUIS) ---
      # Chaque secret accepte la variante _FILE (convention Docker) :
      # SESSION_SECRET_FILE=/run/secrets/session_secret lit le secret dans le
      # fichier au lieu de l'environnement, que `docker inspect` et
      # /proc/<pid>/environ exposent à quiconque atteint le démon Docker. Le _FILE
      # a la priorité ; un fichier illisible refuse le démarrage.
      - SESSION_SECRET=${SESSION_SECRET}
      - SESSION_SECRET_FILE=${SESSION_SECRET_FILE:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      # Adresse du reverse proxy réellement en frontal (ex. Traefik). Vide = aucun
      # en-tête X-Forwarded-For n'est cru : le rate-limiting et l'audit utilisent
      # alors l'IP de la connexion. Ne jamais élargir au-delà du proxy réel.
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      - SKIP_TLS_VERIFY=${SKIP_TLS_VERIFY:-false}
      # --- TLS de l'interface ---
      # Noms/IP inclus dans le certificat auto-signé (séparés par des virgules).
      - TLS_HOSTS=${TLS_HOSTS:-}
      # Votre propre certificat (les deux variables vont ensemble). Montez-le en
      # read-only ci-dessous ; GoaCore ne l'écrase jamais.
      - TLS_CERT_FILE=${TLS_CERT_FILE:-}
      - TLS_KEY_FILE=${TLS_KEY_FILE:-}
      # --- Proxmox (optionnel — configurable depuis l'UI) ---
      - PROXMOX_URL=${PROXMOX_URL:-}
      - PROXMOX_NODE=${PROXMOX_NODE:-pve}
      - PROXMOX_TOKEN_ID=${PROXMOX_TOKEN_ID:-}
      - PROXMOX_TOKEN_SECRET=${PROXMOX_TOKEN_SECRET:-}
      - PROXMOX_TOKEN_SECRET_FILE=${PROXMOX_TOKEN_SECRET_FILE:-}
      - PROXMOX_STORAGE=${PROXMOX_STORAGE:-}
      - PROXMOX_BRIDGE=${PROXMOX_BRIDGE:-}
      # --- Wazuh (optionnel) ---
      - WAZUH_API_URL=${WAZUH_API_URL:-}
      - WAZUH_USER=${WAZUH_USER:-}
      - WAZUH_PASSWORD=${WAZUH_PASSWORD:-}
      - WAZUH_PASSWORD_FILE=${WAZUH_PASSWORD_FILE:-}
      - WAZUH_INDEXER_URL=${WAZUH_INDEXER_URL:-}
      - WAZUH_INDEXER_USER=${WAZUH_INDEXER_USER:-}
      - WAZUH_INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD:-}
      - WAZUH_INDEXER_PASSWORD_FILE=${WAZUH_INDEXER_PASSWORD_FILE:-}
      # --- Discord (optionnel) ---
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - DISCORD_BOT_TOKEN_FILE=${DISCORD_BOT_TOKEN_FILE:-}
      - DISCORD_CHANNEL_ID=${DISCORD_CHANNEL_ID:-}
      - DISCORD_AUTH_CHANNEL_ID=${DISCORD_AUTH_CHANNEL_ID:-}
      - DISCORD_ANSIBLE_CHANNEL_ID=${DISCORD_ANSIBLE_CHANNEL_ID:-}
      # --- IA / enrichissement SOAR (optionnel) ---
      - AI_PROVIDER=${AI_PROVIDER:-}
      - AI_URL=${AI_URL:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_API_KEY_FILE=${AI_API_KEY_FILE:-}
      - AI_MODEL=${AI_MODEL:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      # Playbooks : ceux livrés avec l'image sont recopiés ici à chaque démarrage
      # (sinon le volume les figerait à la version installée le premier jour) ;
      # ceux que vous créez depuis l'interface sont conservés.
      - ansible_playbooks:/app/playbooks
      # Certificat TLS persisté : son empreinte ne change plus à chaque mise à jour.
      - goacore_tls:/app/certs
      # Secrets par fichier (_FILE) — décommentez si vous les utilisez.
      # - ./secrets:/run/secrets:ro
      # Votre propre certificat, si TLS_CERT_FILE/TLS_KEY_FILE sont définis.
      # - ./tls:/run/tls:ro
    # ─── Durcissement du conteneur ────────────────────────────────────────────
    # L'image embarque Ansible (donc Python) pour le module d'automatisation :
    # c'est la plus grosse surface d'attaque du produit. Ces options bornent ce
    # qu'un code arbitraire y obtiendrait.
    read_only: true          # rootfs immuable : rien ne s'installe, rien ne persiste
    tmpfs:
      # Espace de travail d'Ansible et répertoires temporaires où la clé SSH d'une
      # exécution est déposée : en tmpfs, elle ne touche jamais le disque.
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]          # l'app tourne en non-root sur un port > 1024
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    mem_reservation: 256m
    cpus: 2.0
    pids_limit: 512
    # docker-init en PID 1 : le binaire Go ne moissonne pas les orphelins, or le wget
    # du HEALTHCHECK laisse un zombie ssl_client à chaque probe — sans init, les
    # zombies saturent pids_limit en ~4 h (plus aucun fork possible, unhealthy).
    init: true

  db:
    # Épinglée par digest (tag mysql:8.0) : un tag mouvant peut changer la version
    # du moteur sous une base existante au prochain `compose pull`. Mise à jour :
    #   docker buildx imagetools inspect mysql:8.0 --format '{{.Manifest.Digest}}'
    image: mysql@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    container_name: goacore_db
    environment:
      # L'image MySQL implémente aussi la convention _FILE, mais les deux formes
      # sont EXCLUSIVES : si vous renseignez DB_ROOT_PASSWORD_FILE, laissez
      # DB_ROOT_PASSWORD vide (sinon l'entrypoint MySQL refuse de démarrer).
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_ROOT_PASSWORD_FILE=${DB_ROOT_PASSWORD_FILE:-}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_PASSWORD_FILE=${DB_PASSWORD_FILE:-}
    volumes:
      # C'est CE volume qu'il faut sauvegarder (voir l'en-tête + backup.sh). Son
      # nom réel est <projet>_mysql_data ; `docker volume ls` pour le retrouver.
      - mysql_data:/var/lib/mysql
      # - ./secrets:/run/secrets:ro
    restart: unless-stopped
    # read_only n'est PAS appliqué à MySQL : son entrypoint ajuste les droits du
    # datadir et du socket au démarrage, ce qu'un rootfs en lecture seule ferait
    # échouer. On se limite aux capacités : tout est retiré sauf les quatre dont
    # l'entrypoint a besoin pour préparer le datadir puis abandonner les
    # privilèges (gosu) vers l'utilisateur mysql.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    mem_reservation: 512m
    cpus: 2.0
    pids_limit: 512
    healthcheck:
      # Mot de passe lu dans les DEUX formes acceptées par l'image MySQL :
      # MYSQL_ROOT_PASSWORD (environnement) ou MYSQL_ROOT_PASSWORD_FILE (secret par
      # fichier, la forme recommandée dans .env.example). Ne sonder que la première
      # laissait la base éternellement « unhealthy » avec un secret par fichier —
      # donc `depends_on: service_healthy` bloquait le démarrage de l'app.
      # Les `$$` sont l'échappement Compose : ils arrivent en `$` dans le conteneur.
      test:
        - CMD-SHELL
        - >-
          PW="$${MYSQL_ROOT_PASSWORD:-}";
          [ -n "$$PW" ] || PW="$$(cat "$${MYSQL_ROOT_PASSWORD_FILE:-/dev/null}" 2>/dev/null)";
          mysqladmin ping -h localhost -u root -p"$$PW" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  # État complet de GoaCore + secrets chiffrés : à sauvegarder avec SESSION_SECRET.
  mysql_data:
  # Playbooks de l'utilisateur (ceux livrés sont resynchronisés depuis l'image).
  ansible_playbooks:
  # Certificat + clé TLS de l'interface. Sauvegarde facultative : GoaCore régénère
  # la paire si elle disparaît (l'empreinte change alors, une fois).
  goacore_tls:
