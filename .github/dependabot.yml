# Veille de dépendances — Tier 1 (produit).
# Mensuel et groupé : l'objectif est de voir passer les montées de version,
# pas de noyer le dépôt sous des PR unitaires.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    groups:
      go-deps:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    groups:
      npm-deps:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ["*"]
