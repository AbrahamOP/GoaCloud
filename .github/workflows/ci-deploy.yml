name: CI & Deploy

# SÉCURITÉ — le dépôt est PUBLIC et le runner `self-hosted` vit sur le LAN de
# l'auteur (socket Docker, coffre de secrets, accès aux services internes). Le code
# d'une Pull Request — potentiellement issue d'un fork inconnu, cf. CONTRIBUTING.md —
# ne doit JAMAIS s'y exécuter. Tous les jobs déclenchés par une PR tournent donc sur
# un runner GitHub hébergé et jetable ; seuls les `push` sur dev/main (du code déjà
# mergé, donc relu) atteignent le self-hosted.
#
# Corollaire : aucune valeur contrôlée par un tiers (titre/corps de PR, nom de
# branche, acteur, message de commit) n'est interpolée directement dans un `run:` —
# l'expansion `${{ }}` est textuelle et précède l'analyse par bash, donc un titre de
# PR bien choisi refermerait la chaîne et exécuterait sa charge. Ces valeurs passent
# exclusivement par des variables d'environnement, citées et assainies.

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

# Moindre privilège par défaut ; les jobs qui écrivent (release, publish) le
# redemandent explicitement.
permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    # PR (code non relu) -> runner jetable GitHub ; push interne -> self-hosted.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'self-hosted' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # Suit la directive `go` de go.mod plutôt qu'une version figée ici : une
          # version épinglée en dur diverge silencieusement du module (le runner
          # télécharge alors le toolchain manquant et la CI ne teste plus ce que
          # l'image construit, qui est en GOTOOLCHAIN=local).
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      # CONTRIBUTING.md annonce `gofmt -l .` comme faisant partie de la CI : cette
      # étape rend l'affirmation vraie. gofmt n'ayant pas de code de sortie d'échec,
      # on transforme sa sortie en échec explicite.
      - name: Format (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::Fichiers non formatés (lancer 'gofmt -w') :"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # Étape BLOQUANTE. La dette est résorbée (x/crypto v0.52.0, chi v5.2.2,
      # toolchain go1.25.12) : `govulncheck ./...` ne remonte plus aucune
      # vulnérabilité effectivement appelée. La garder non bloquante reviendrait à
      # laisser la prochaine repasser inaperçue.
      - name: Vulnérabilités (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Build
        run: CGO_ENABLED=0 go build -o bin/goacloud ./cmd/server

      # Construit réellement l'image (sans la pousser). `go build` seul ne dit rien
      # du Dockerfile : c'est cette étape qui attrape une incohérence entre le
      # builder épinglé et la directive `go` de go.mod, ou une étape de build CSS
      # cassée — deux pannes qui, sinon, ne se voient qu'au déploiement.
      - name: Build de l'image conteneur
        run: docker build -t goacore:ci .

  # Détecteur de course, dans un job SÉPARÉ et sur un runner GitHub. `-race` exige
  # cgo, donc un compilateur C : le runner self-hosted n'en a pas (CGO_ENABLED
  # retombe à 0 et `go test -race` refuse de démarrer). Plutôt que d'installer une
  # chaîne C sur le CT du runner pour un job qui n'a besoin d'aucun accès au LAN,
  # on l'exécute là où gcc est fourni. Les déploiements en dépendent : une data
  # race doit bloquer la mise en production, pas seulement teinter un log.
  race:
    name: Détecteur de course
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Test (race detector)
        env:
          CGO_ENABLED: "1"
        run: go test ./... -race

  # Migrations de schéma sur une VRAIE base. Le job `build` ci-dessus n'exerce que
  # la logique pure (classification d'erreurs, plan d'index) : les tests qui
  # rejouent la montée de version d'une base cliente existante — schéma d'avant le
  # versionnement, ancienne clé unique, doublons de VMID — étaient `t.Skip` faute de
  # DSN, donc jamais exécutés. C'est pourtant le chemin le plus risqué du produit :
  # il tourne chez le client, sans surveillance, au premier démarrage après une mise
  # à jour, sur des données qu'on ne peut pas recréer.
  #
  # TOUJOURS sur un runner GitHub jetable, PR comme push (contrairement à `build`
  # qui bascule sur le self-hosted) : `services:` publie 3306 sur l'hôte du runner,
  # et le self-hosted fait tourner de vraies bases. On ne lui pose pas un MySQL de
  # test sur un port qu'il utilise peut-être déjà, pour un job qui n'a besoin
  # d'aucun accès au LAN. Le code d'une PR de fork n'y est donc jamais un problème
  # non plus (cf. bandeau sécurité en tête de fichier).
  db-tests:
    name: Migrations (MySQL réel)
    runs-on: ubuntu-latest
    services:
      mysql:
        # Tag et non digest, à la différence de docker-compose.yml : ici on veut
        # justement tester contre le MySQL 8.0 courant, pas contre une version
        # figée. La prod, elle, reste épinglée.
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: goacore-ci
          MYSQL_DATABASE: goacore_test
        ports:
          - 3306:3306
        # Sans health-check, les étapes démarrent avant que MySQL n'accepte les
        # connexions et le job échoue au premier Ping.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pgoacore-ci --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=20s
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      # -count=1 : jamais de résultat mis en cache pour un test dont tout l'intérêt
      # est de toucher un serveur externe.
      # GOACORE_REQUIRE_DB_TESTS : transforme un DSN manquant en ÉCHEC au lieu d'un
      # skip. Sans ce verrou, retirer le service MySQL ci-dessus repasserait la CI
      # au vert avec zéro test exécuté — exactement l'angle mort qu'on répare ici.
      - name: Migrations sur une base MySQL réelle
        env:
          GOACORE_TEST_DSN: root:goacore-ci@tcp(127.0.0.1:3306)/goacore_test?parseTime=true
          GOACORE_REQUIRE_DB_TESTS: "1"
        run: go test ./internal/database/ -race -count=1 -v

  # The goabackup SSH helper is the AUTHORITATIVE security boundary on the Proxmox
  # host (forced-command, closed op set, the readonly 9500-9599 sandbox VMID guard).
  # The Go anti-drift test (TestSandboxVMIDRangeMatchesHelper, run in the build job)
  # already fails if the Go range diverges from the helper's VMID_SANDBOX_MIN/MAX —
  # but only against the VENDORED copy under deploy/goabackup/. This job validates
  # that copy in its own right (syntax, lint, behaviour) so a broken or weakened
  # helper blocks a deploy: deploy-dev/prod depend on it. The harness stubs every
  # external command (pvesm/lvs/zfs/zpool/df/rclone), so it needs only bash and
  # NEVER touches a real host.
  helper:
    name: Validate goabackup helper
    # `test-runner.sh` vient de la PR : il ne s'exécute jamais sur le self-hosted
    # pour une PR (cf. bandeau sécurité en tête de fichier).
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'self-hosted' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Bash syntax (bash -n)
        run: bash -n deploy/goabackup/goabackup-runner.sh

      - name: ShellCheck (errors only)
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -S error deploy/goabackup/goabackup-runner.sh
          else
            echo "::warning::shellcheck not installed on runner — skipping lint (bash -n + harness still gate)"
          fi

      - name: Functional harness (stubbed, no host access)
        run: bash deploy/goabackup/test-runner.sh

  deploy-dev:
    name: Deploy DEV
    needs: [build, race, helper, db-tests]
    runs-on: self-hosted
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    steps:
      - name: Reset DEV containers and volumes
        run: |
          docker stop goacloud_app_dev goacloud_db_dev 2>/dev/null || true
          docker rm -f goacloud_app_dev goacloud_db_dev 2>/dev/null || true
          docker volume rm goacloud-dev_mysql_data_dev goacloud-dev_ansible_playbooks_dev 2>/dev/null || true
          docker rmi goacloud-dev-app 2>/dev/null || true
          docker builder prune -af 2>/dev/null || true

      # Un webhook révoqué ou un hôte à court de disque répond 4xx/5xx : sans
      # vérification du code HTTP la CI resterait verte alors que rien n'est déployé.
      - name: Trigger Portainer (DEV)
        env:
          WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK_URL_DEV }}
        run: |
          BODY=$(mktemp)
          CODE=$(curl -sk -o "$BODY" -w '%{http_code}' --max-time 300 \
            -X POST "$WEBHOOK" -H "Content-Type: application/json" -d '{}')
          if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then
            echo "::error::Webhook Portainer DEV : HTTP $CODE — déploiement NON effectué"
            head -c 500 "$BODY"
            exit 1
          fi
          echo "Webhook Portainer DEV accepté (HTTP $CODE)"

      - name: Vérifier que DEV répond
        env:
          PROBE_URL: ${{ vars.DEV_PROBE_URL || 'https://devcore.goacloud.fr/' }}
        run: |
          for i in $(seq 1 30); do
            CODE=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 5 "$PROBE_URL" || echo 000)
            if [ "$CODE" -ge 200 ] && [ "$CODE" -lt 400 ]; then
              echo "DEV répond (HTTP $CODE) après $i tentative(s)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::DEV ne répond pas après 150s (dernier code : $CODE)"
          exit 1

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
        run: |
          export LC_ALL=C.UTF-8
          SAFE_MSG=$(printf '%s' "$COMMIT_MSG" | head -1 | tr -d '"\\' | tr -d '\000-\037' | cut -c1-100)
          SAFE_ACTOR=$(printf '%s' "$ACTOR" | tr -cd 'A-Za-z0-9._-' | cut -c1-64)
          SHORT="${GITHUB_SHA:0:7}"
          curl -sf -H "Content-Type: application/json" -X POST "$DISCORD_WEBHOOK" -d "{
            \"embeds\": [{
              \"title\": \"GoaCore DEV - Deploy OK\",
              \"description\": \"**Commit:** \`$SHORT\`\\n**Auteur:** $SAFE_ACTOR\\n**Message:** $SAFE_MSG\\n\\n:globe_with_meridians: https://devcore.goacloud.fr\",
              \"color\": 3447003,
              \"footer\": {\"text\": \"Branche dev | Self-hosted runner\"}
            }]
          }"

  deploy-prod:
    name: Deploy PROD
    needs: [build, race, helper, db-tests]
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # The Portainer webhook re-pulls the repo then runs compose pull -> build -> up.
      # The app service is build-only (no pinned `image:` registry tag — see
      # docker-compose.yml), so `compose pull` SKIPS it (no "pull access denied"
      # abort that previously killed every prod redeploy), Portainer rebuilds it from
      # source and `up -d` recreates the container with the new code. The db container
      # and ALL named volumes (MySQL data) are preserved. No pre-build / no rm needed.
      #
      # Le code HTTP est vérifié : un webhook révoqué ou un hôte plein renvoie 5xx et
      # doit faire échouer le job. Sans ça la CI reste verte, Discord annonce
      # « Deploy OK », la version est taguée — et la prod tourne sur l'ancienne image.
      - name: Trigger Portainer (PROD)
        env:
          WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK_URL_PROD }}
        run: |
          BODY=$(mktemp)
          CODE=$(curl -sk -o "$BODY" -w '%{http_code}' --max-time 300 \
            -X POST "$WEBHOOK" -H "Content-Type: application/json" -d '{}')
          if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then
            echo "::error::Webhook Portainer PROD : HTTP $CODE — déploiement NON effectué"
            head -c 500 "$BODY"
            exit 1
          fi
          echo "Webhook Portainer PROD accepté (HTTP $CODE)"

      # Le webhook est asynchrone : un 2xx signifie « pris en compte », pas
      # « en ligne ». On sonde l'application jusqu'à ce qu'elle réponde (2xx/3xx —
      # `/` redirige vers /login quand la session est absente).
      - name: Vérifier que PROD répond
        env:
          PROBE_URL: ${{ vars.PROD_PROBE_URL || 'https://core.goacloud.fr/' }}
        run: |
          for i in $(seq 1 30); do
            CODE=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 5 "$PROBE_URL" || echo 000)
            if [ "$CODE" -ge 200 ] && [ "$CODE" -lt 400 ]; then
              echo "PROD répond (HTTP $CODE) après $i tentative(s)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::PROD ne répond pas après 150s (dernier code : $CODE)"
          exit 1

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
        run: |
          export LC_ALL=C.UTF-8
          SAFE_MSG=$(printf '%s' "$COMMIT_MSG" | head -1 | tr -d '"\\' | tr -d '\000-\037' | cut -c1-100)
          SAFE_ACTOR=$(printf '%s' "$ACTOR" | tr -cd 'A-Za-z0-9._-' | cut -c1-64)
          SHORT="${GITHUB_SHA:0:7}"
          curl -sf -H "Content-Type: application/json" -X POST "$DISCORD_WEBHOOK" -d "{
            \"embeds\": [{
              \"title\": \"GoaCore PROD - Deploy OK\",
              \"description\": \"**Commit:** \`$SHORT\`\\n**Auteur:** $SAFE_ACTOR\\n**Message:** $SAFE_MSG\\n\\n:globe_with_meridians: https://core.goacloud.fr\",
              \"color\": 3066993,
              \"footer\": {\"text\": \"Branche main | Self-hosted runner\"}
            }]
          }"

  release:
    name: Auto Release
    needs: deploy-prod
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    outputs:
      # Consommés par le job `publish` : un tag poussé avec GITHUB_TOKEN ne
      # redéclenche AUCUN workflow (garde anti-boucle GitHub), donc publish-image.yml
      # ne se réveille pas tout seul — c'est pour ça qu'on chaîne la publication ici.
      tag: ${{ steps.release.outputs.tag }}
      created: ${{ steps.release.outputs.created }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Determine version bump and create release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WEBHOOK_ANNONCES: ${{ secrets.DISCORD_WEBHOOK_ANNONCES }}
          WEBHOOK_CHANGELOG: ${{ secrets.DISCORD_WEBHOOK_CHANGELOG }}
          REPO: ${{ github.repository }}
        run: |
          set -e

          # Get latest tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"

          # Parse current version
          VERSION="${LATEST_TAG#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)

          # Analyze commits since last tag
          COMMITS=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"%s" 2>/dev/null || git log --pretty=format:"%s")

          HAS_BREAKING=false
          HAS_FEAT=false
          HAS_FIX=false

          while IFS= read -r msg; do
            if echo "$msg" | grep -qi "BREAKING CHANGE\|^.*!:"; then
              HAS_BREAKING=true
            elif echo "$msg" | grep -q "^feat"; then
              HAS_FEAT=true
            elif echo "$msg" | grep -q "^fix"; then
              HAS_FIX=true
            fi
          done <<< "$COMMITS"

          # Determine bump
          if [ "$HAS_BREAKING" = true ]; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif [ "$HAS_FEAT" = true ]; then
            MINOR=$((MINOR + 1)); PATCH=0
          elif [ "$HAS_FIX" = true ]; then
            PATCH=$((PATCH + 1))
          else
            PATCH=$((PATCH + 1))
          fi

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "New version: $NEW_TAG"

          # Skip if tag already exists
          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            echo "Tag $NEW_TAG already exists, skipping release"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Build changelog grouped by type
          CHANGELOG=""
          FEATS=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"- %s (%h)" --grep="^feat" 2>/dev/null || true)
          FIXES=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"- %s (%h)" --grep="^fix" 2>/dev/null || true)
          OTHERS=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"%s" 2>/dev/null | grep -v "^feat\|^fix" | sed 's/^/- /' || true)

          if [ -n "$FEATS" ]; then
            CHANGELOG="${CHANGELOG}### Features\n${FEATS}\n\n"
          fi
          if [ -n "$FIXES" ]; then
            CHANGELOG="${CHANGELOG}### Bug Fixes\n${FIXES}\n\n"
          fi
          if [ -n "$OTHERS" ]; then
            CHANGELOG="${CHANGELOG}### Other Changes\n${OTHERS}\n\n"
          fi

          BODY=$(printf "## What's Changed\n\n${CHANGELOG}**Full Changelog**: https://github.com/${REPO}/compare/${LATEST_TAG}...${NEW_TAG}")

          # Create tag and push
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"

          # Escape body for JSON (handle newlines and quotes)
          BODY_ESCAPED=$(echo "$BODY" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read())[1:-1])")

          # Create GitHub Release via API (no gh/jq needed on runner)
          curl -sf -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${REPO}/releases" \
            -d "{\"tag_name\":\"${NEW_TAG}\",\"name\":\"${NEW_TAG}\",\"body\":\"${BODY_ESCAPED}\",\"draft\":false,\"prerelease\":false,\"make_latest\":\"true\"}"

          echo "Release $NEW_TAG created successfully"

          # Passe la main au job `publish` (image GHCR).
          {
            echo "tag=$NEW_TAG"
            echo "created=true"
          } >> "$GITHUB_OUTPUT"

          # Notify Discord
          RELEASE_URL="https://github.com/${REPO}/releases/tag/${NEW_TAG}"
          if [ -n "$DISCORD_WEBHOOK" ]; then
            curl -sf -H "Content-Type: application/json" -X POST "$DISCORD_WEBHOOK" -d "{
              \"embeds\": [{
                \"title\": \"GoaCloud $NEW_TAG Released\",
                \"description\": \"Nouvelle release deployee en production.\\n\\n:link: ${RELEASE_URL}\",
                \"color\": 5763719,
                \"footer\": {\"text\": \"Auto-release | main\"}
              }]
            }" || true
          fi

          # Annonces communauté : #annonces (résumé) + #changelog (notes complètes)
          if [ -n "$WEBHOOK_ANNONCES" ]; then
            curl -sf -H "Content-Type: application/json" -H "User-Agent: GoaCore-Release/1.0" -X POST "$WEBHOOK_ANNONCES" -d "{
              \"username\": \"GoaCore\",
              \"embeds\": [{
                \"title\": \"🚀 GoaCore ${NEW_TAG} est disponible !\",
                \"url\": \"${RELEASE_URL}\",
                \"description\": \"Une nouvelle version de **GoaCore** vient de sortir ! 🎉\\nRetrouve le détail des changements dans le changelog. 📋\",
                \"color\": 1940085,
                \"footer\": {\"text\": \"GoaCore • ${NEW_TAG}\"}
              }]
            }" || true
          fi
          if [ -n "$WEBHOOK_CHANGELOG" ]; then
            curl -sf -H "Content-Type: application/json" -H "User-Agent: GoaCore-Release/1.0" -X POST "$WEBHOOK_CHANGELOG" -d "{
              \"username\": \"GoaCore\",
              \"embeds\": [{
                \"title\": \"📋 GoaCore ${NEW_TAG}\",
                \"url\": \"${RELEASE_URL}\",
                \"description\": \"${BODY_ESCAPED}\",
                \"color\": 5458615,
                \"footer\": {\"text\": \"GoaCore • ${NEW_TAG}\"}
              }]
            }" || true
          fi

  # Publication de l'image publique ghcr.io/goacloud/goacore DANS LE MÊME RUN que la
  # release. Le tag créé ci-dessus l'est avec GITHUB_TOKEN : GitHub ne redéclenche
  # aucun workflow sur un événement produit par GITHUB_TOKEN, donc publish-image.yml
  # (sur `push: tags`) ne partait jamais — l'image GHCR était figée plusieurs semaines
  # derrière le dépôt alors que le README promet une image publiée à chaque version.
  # publish-image.yml reste utile pour republier un tag à la main (workflow_dispatch).
  publish:
    name: Publish image (GHCR)
    needs: release
    if: needs.release.outputs.created == 'true'
    # Runner GitHub : buildx + QEMU y sont disponibles (build multi-arch), et le
    # self-hosted n'a pas à porter ce build.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout (tag de la release)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Set up QEMU (émulation arm64)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `value=` est explicite : le run tourne sur un ref de branche (main), pas sur
      # le ref du tag, donc `type=semver` ne peut pas le déduire seul. `latest` est
      # légitime ici : on vient tout juste de tagger la release depuis main.
      - name: Métadonnées (tags + labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/goacloud/goacore
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.tag }}
            type=raw,value=latest

      - name: Build & push (amd64 + arm64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify-pr:
    name: PR Check
    needs: [build, race, helper, db-tests]
    runs-on: ubuntu-latest
    # Une PR de fork n'a de toute façon pas accès aux secrets : le webhook serait
    # vide et l'étape échouerait bruyamment pour rien. On ne notifie que les PR
    # internes.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Notify Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Valeurs contrôlées par l'auteur de la PR : jamais interpolées dans le
          # script, uniquement lues (et assainies) depuis l'environnement.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ACTOR: ${{ github.actor }}
        run: |
          export LC_ALL=C.UTF-8
          SAFE_TITLE=$(printf '%s' "$PR_TITLE" | tr -d '"\\' | tr -d '\000-\037' | cut -c1-120)
          SAFE_ACTOR=$(printf '%s' "$ACTOR" | tr -cd 'A-Za-z0-9._-' | cut -c1-64)
          SAFE_NUMBER=$(printf '%s' "$PR_NUMBER" | tr -cd '0-9' | cut -c1-12)
          curl -sf -H "Content-Type: application/json" -X POST "$DISCORD_WEBHOOK" -d "{
            \"embeds\": [{
              \"title\": \"GoaCloud - PR #${SAFE_NUMBER} prete\",
              \"description\": \"**PR:** $SAFE_TITLE\\n**Auteur:** $SAFE_ACTOR\\n\\nBuild OK, pret a merge dans main (PROD).\",
              \"color\": 15844367,
              \"footer\": {\"text\": \"Pull Request dev -> main\"}
            }]
          }"
