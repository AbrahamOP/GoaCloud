name: Publish image (GHCR)

# Publie l'image Docker publique ghcr.io/abrahamop/goacore pour faciliter
# l'installation (docker compose up sans build).
#
# CHEMIN NOMINAL : la publication est chaînée à la release, dans ci-deploy.yml
# (job `publish`, `needs: release`). Un tag poussé avec GITHUB_TOKEN ne redéclenche
# aucun workflow — ce fichier ne se réveillait donc jamais sur les auto-releases,
# et l'image GHCR est restée des semaines derrière le dépôt.
#
# CE WORKFLOW EST LE FILET DE SECOURS : republier un tag à la main
# (workflow_dispatch en se plaçant sur le tag), ou publier un tag poussé
# manuellement (PAT / clé de déploiement), hors du chemin d'auto-release.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest  # runner GitHub (gratuit sur repo public) : buildx + QEMU dispo
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0  # historique + tags requis par la vérification `latest` ci-dessous

      # `latest` doit désigner la dernière version publiée de `main`, et rien
      # d'autre. Auparavant il était posé inconditionnellement : un
      # workflow_dispatch lancé depuis un vieux tag faisait RECULER `latest`, et
      # chaque nouvel installateur suivant le README récupérait une version
      # périmée. On ne le pose donc que si le ref est bien un tag de version,
      # atteignable depuis `main`, et que c'est le plus récent de `main`.
      - name: Faut-il poser le tag `latest` ?
        id: latest
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "Ref '$GITHUB_REF_NAME' n'est pas un tag → pas de 'latest'"
            echo "value=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # En cas de doute (fetch impossible, tag hors de main), on s'abstient :
          # ne pas poser 'latest' est toujours moins grave que le faire reculer.
          if ! git fetch --quiet --tags origin '+refs/heads/main:refs/remotes/origin/main'; then
            echo "::warning::Impossible de récupérer main → pas de 'latest'"
            echo "value=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge-base --is-ancestor "$GITHUB_REF_NAME" origin/main; then
            echo "Tag $GITHUB_REF_NAME absent de main → pas de 'latest'"
            echo "value=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NEWEST=$(git tag --list 'v*.*.*' --merged origin/main --sort=-v:refname | head -1)
          if [ "$NEWEST" = "$GITHUB_REF_NAME" ]; then
            echo "$GITHUB_REF_NAME est la dernière version de main → 'latest' posé"
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version plus récente sur main ($NEWEST) → pas de 'latest'"
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU (émulation arm64)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Métadonnées (tags + labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/abrahamop/goacore
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.latest.outputs.value == 'true' }}

      - name: Build & push (amd64 + arm64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
