[defaults]
interpreter_python = auto_silent
# host_key_checking reste à sa valeur par défaut (True) : l'identité de l'hôte est
# vérifiée contre les clés déjà épinglées par GoaCore (table ssh_host_keys). Le
# known_hosts temporaire et StrictHostKeyChecking=yes sont injectés par
# RunPlaybook (internal/services/ansible.go). Ne pas remettre host_key_checking =
# False : cela redonnerait à n'importe quel hôte de la cible le droit de recevoir
# la clé privée et l'escalade sudo.
